<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{templeName}}</title>
    <!-- Inter, the font the Admin Panel uses; mail apps that block web fonts fall back to the system fonts below. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body, table, td, p, a, span, strong, th { font-family: Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      @media only screen and (max-width: 620px) {
        .ssd-card { border-radius: 0 !important; }
        .ssd-pad { padding-left: 22px !important; padding-right: 22px !important; }
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background:#f4eaeb;">
    <!-- ssd-email-shell -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4eaeb;">
      <tr>
        <td align="center" style="padding:32px 12px;">
          <table role="presentation" class="ssd-card" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#ffffff;border-radius:16px;border-collapse:separate;overflow:hidden;box-shadow:0 10px 30px rgba(124,21,39,0.16);">
            <tr>
              <td align="center" bgcolor="#7c1527" style="background-color:#7c1527;background-image:linear-gradient(135deg,#5a0e1c 0%,#7c1527 55%,#932239 100%);padding:28px 24px 26px;">
                {{#if entityLogo}}
                <table role="presentation" cellpadding="0" cellspacing="0" align="center">
                  <tr>
                    <td align="center" style="background:#ffffff;border-radius:12px;padding:12px 22px;">
                      <img src="{{entityLogo}}" alt="{{templeName}}" width="170" style="display:block;max-width:170px;width:170px;height:auto;border:0;outline:none;text-decoration:none;" />
                    </td>
                  </tr>
                </table>
                {{else}}
                <span style="display:block;font-size:22px;font-weight:700;color:#ffffff;letter-spacing:0.02em;">{{templeName}}</span>
                {{/if}}
              </td>
            </tr>
            <tr>
              <td style="height:4px;background:#c1851a;font-size:0;line-height:0;">&nbsp;</td>
            </tr>
            <tr>
              <td class="ssd-pad" style="padding:34px 40px 38px;font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#2b1a1f;font-size:15px;line-height:1.65;">
                {{{body}}}
              </td>
            </tr>
            <tr>
              <td class="ssd-pad" align="center" style="background:#faf4f5;border-top:1px solid #efe3e5;padding:24px 32px 26px;font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px;line-height:1.7;color:#7a6a60;">
                <strong style="color:#7c1527;font-size:13.5px;">{{templeName}}</strong><br />
                {{#if footerAddress}}{{footerAddress}}<br />{{/if}}
                {{#if footerContact}}{{footerContact}}<br />{{/if}}
                <span style="display:block;margin-top:10px;font-size:11.5px;color:#a3948a;">This is an automated message, please do not reply to this email.<br />&copy; {{year}} {{templeName}}</span>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
