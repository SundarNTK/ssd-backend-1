name: Deploy PRODUCTION - backend

# Every push to the main branch (including a merged pull request) builds the image,
# pushes it to Amazon ECR as :prod, then tells the PRODUCTION EC2 server (through AWS
# Systems Manager) to pull it and restart the backend container. No SSH and no AWS keys:
# GitHub signs in to AWS with a role (OIDC). Settings changes (backend.env) are NOT
# deployed here.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod-backend
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: ssd-backend
  INSTANCE_ID: i-065afe872c9c7785e
  SERVICE: backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE=$REGISTRY/$ECR_REPOSITORY
          docker build -t $IMAGE:prod -t $IMAGE:prod-${GITHUB_SHA::7} .
          docker push $IMAGE:prod
          docker push $IMAGE:prod-${GITHUB_SHA::7}

      - name: Deploy on the server (SSM)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          CMD="cd /opt/ssd && /usr/local/bin/aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY && docker compose pull $SERVICE && docker compose up -d $SERVICE && docker image prune -f && docker compose ps"
          jq -n --arg c "$CMD" '{commands:[$c]}' > params.json
          ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $SERVICE ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
